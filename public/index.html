<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Server Control</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🎛️</text></svg>" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot" id="globalDot"></span>
      <h1>Server Control</h1>
    </div>
    <div class="meta">
      <span id="hostLabel"></span>
      <span id="clock"></span>
      <span id="live" class="live" title="Live connection status">live</span>
      <button id="signout" class="icon hidden" title="Sign out">Sign out</button>
    </div>
  </header>

  <main id="cards" class="cards"></main>

  <section class="feed" id="feedSection">
    <h2>Activity</h2>
    <ul id="alerts" class="alerts"></ul>
  </section>

  <template id="cardTemplate">
    <article class="card">
      <div class="card-head">
        <div class="title">
          <span class="dot"></span>
          <h2 class="name"></h2>
        </div>
        <div class="head-right">
          <span class="badge players"></span>
          <button class="icon popout" title="Open in its own window">⧉</button>
        </div>
      </div>

      <div class="stats"></div>

      <div class="countdown hidden"></div>

      <div class="mods-banner hidden">
        <span class="mods-text"></span>
        <button class="mini mods-install hidden">Refresh mods</button>
      </div>

      <div class="update-banner hidden">
        <span class="update-text"></span>
        <button data-act="updateCancel" class="mini update-cancel hidden">Start it anyway</button>
      </div>

      <div class="section players-list">
        <h3>Players</h3>
        <ul class="playerlist"></ul>
      </div>

      <div class="section service-info hidden">
        <h3>Endpoint</h3>
        <ul class="infolist"></ul>
      </div>

      <div class="section controls">
        <h3>Controls</h3>
        <div class="btnrow">
          <button data-act="start" class="btn good">Start</button>
          <button data-act="restart" class="btn warn">Restart now</button>
          <button data-act="updateRestart" class="btn warn" title="Run the update command, then restart">Update &amp; restart</button>
          <button data-act="updateBegin" class="btn warn game-only" title="Ask the publisher whether there is a newer version. If there is, the server stops so it can be installed, and starts itself again afterwards. Minecraft is downloaded and installed by the dashboard; a Steam game waits for you to press Update in Steam.">Check for update</button>
          <button data-act="stop" class="btn bad">Stop</button>
          <button data-act="save" class="btn game-only">Save world</button>
        </div>
        <div class="btnrow game-only delay-row">
          <input class="countdown-min" type="number" min="1" max="240" value="15" title="minutes" />
          <button data-act="scheduleRestart" class="btn" title="Restart after this many minutes, warning players on the way down if this game can">Warn &amp; restart</button>
          <button data-act="restartWhenEmpty" class="btn" title="Wait until nobody is online, then restart. Gives up after this many minutes rather than restarting on top of players.">Restart when empty</button>
          <button data-act="cancelRestart" class="btn ghost">Cancel</button>
        </div>
        <div class="btnrow game-only">
          <input class="broadcast-msg" type="text" placeholder="Broadcast message to players" />
          <button data-act="broadcast" class="btn">Send</button>
        </div>
        <div class="action-status"></div>
        <div class="no-remote hidden"></div>
        <pre class="update-out hidden"></pre>
      </div>

      <div class="section console game-only">
        <h3>RCON console</h3>
        <pre class="output"></pre>
        <div class="btnrow rcon-pickrow hidden">
          <select class="rcon-pick">
            <option value="">Commands…</option>
          </select>
        </div>
        <div class="cmd-help hidden"></div>
        <div class="btnrow cmd-typeahead">
          <input class="rcon-input" type="text" placeholder="e.g. listplayers" spellcheck="false"
                 autocomplete="off" autocapitalize="off" autocorrect="off" role="combobox"
                 aria-expanded="false" aria-autocomplete="list" />
          <button class="btn rcon-send">Run</button>
          <ul class="cmd-suggest hidden" role="listbox"></ul>
        </div>
      </div>

      <div class="section chart-wrap">
        <h3>Last 3 hours</h3>
        <svg class="chart" viewBox="0 0 300 60" preserveAspectRatio="none"></svg>
        <div class="chart-legend"></div>
      </div>

      <details class="section schedules">
        <summary>Schedules</summary>
        <ul class="schedulelist"></ul>
        <div class="sched-form">
          <div class="sched-field">
            <label class="sched-label">Do what</label>
            <select class="sched-action">
              <option value="restart">Restart</option>
              <option value="backup">Back up</option>
              <option value="save">Save</option>
              <option value="broadcast">Broadcast</option>
              <option value="start">Start</option>
              <option value="stop">Stop</option>
            </select>
          </div>

          <div class="sched-field sched-field-when">
            <label class="sched-label">How often</label>
            <select class="sched-preset">
              <option value="0 5 * * *">Every day at 05:00</option>
              <option value="0 3 * * *">Every day at 03:00</option>
              <option value="0 */6 * * *">Every 6 hours</option>
              <option value="0 */12 * * *">Every 12 hours</option>
              <option value="30 4 * * 0">Every Sunday at 04:30</option>
              <option value="*/30 * * * *">Every 30 minutes</option>
              <option value="custom">Custom (write it myself)…</option>
            </select>
          </div>

          <div class="sched-field sched-field-warn">
            <label class="sched-label">Warn players first</label>
            <div class="sched-inline">
              <input class="sched-warn" type="number" min="0" max="60" value="15" />
              <span class="sched-unit">min (0 = no warning)</span>
            </div>
          </div>

          <div class="sched-field sched-field-add">
            <button class="btn sched-add">Add schedule</button>
          </div>
        </div>

        <div class="sched-field sched-field-cron hidden">
          <label class="sched-label">Cron expression</label>
          <input class="sched-cron" type="text" placeholder="0 5 * * *" spellcheck="false" />
          <div class="sched-legend">
            <span><b>0</b> minute <span class="dim">0–59</span></span>
            <span><b>5</b> hour <span class="dim">0–23</span></span>
            <span><b>*</b> day of month <span class="dim">1–31</span></span>
            <span><b>*</b> month <span class="dim">1–12</span></span>
            <span><b>*</b> weekday <span class="dim">0–6, Sun=0</span></span>
          </div>
          <div class="sched-legend sched-legend-syntax">
            <span><b>*</b> = every</span>
            <span><b>*/5</b> = every 5th</span>
            <span><b>1-4</b> = a range</span>
            <span><b>1,4</b> = a list</span>
          </div>
        </div>

        <div class="sched-field sched-field-message hidden">
          <label class="sched-label">Message to send</label>
          <input class="sched-message" type="text" placeholder="Server restarting shortly!" />
        </div>

        <div class="sched-preview">Pick a schedule above.</div>
        <div class="sched-hint">Times use this machine's clock. Jobs from config.json are read-only here.</div>
      </details>

      <details class="section mods game-only">
        <summary><span class="mods-label">Mods</span> <span class="mods-count"></span></summary>
        <div class="btnrow">
          <button class="btn mini-btn mods-refresh">Re-read from disk</button>
          <button class="btn mini-btn mods-install hidden">Refresh from Steam</button>
          <button class="btn mini-btn plugins-update hidden">Update plugins</button>
          <span class="mods-status"></span>
        </div>
        <ul class="modlist"></ul>
        <div class="mods-where"></div>
      </details>

      <details class="section moderation game-only">
        <summary>Bans &amp; moderation <span class="ban-count"></span></summary>

        <div class="btnrow ban-add">
          <input class="ban-name" type="text" placeholder="Player name" spellcheck="false"
                 autocomplete="off" autocapitalize="off" autocorrect="off" />
          <input class="ban-reason" type="text" placeholder="Reason (optional)" />
          <button class="btn bad ban-do">Ban</button>
        </div>
        <div class="mod-status"></div>

        <h4 class="mod-head">Banned players</h4>
        <ul class="banlist"></ul>

        <h4 class="mod-head">Recent kicks &amp; bans</h4>
        <ul class="modevents"></ul>
      </details>

      <details class="section backups">
        <summary>Backups</summary>
        <div class="btnrow">
          <button class="btn backup-now">Back up now</button>
          <span class="backup-status"></span>
        </div>
        <ul class="backuplist"></ul>
      </details>

      <details class="section logs">
        <summary>Log tail</summary>
        <pre class="logout">loading…</pre>
      </details>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
